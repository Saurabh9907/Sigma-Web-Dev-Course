<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>outline,box-shadow,text-shadow</title>
    <style>
        /* *{
            padding: 0;
            margin: 0;
        } */
        .box{
            border: 2px solid black;
            background-color: aqua;
            width: 500px;
            border-radius: 5px;
            box-shadow: 9px 8px 20px 5px red;
            padding: 10px;
            height: 50px;
            outline-offset:10px;
            outline: 2px solid red;
            margin: 50px;
        }
        p{
            text-shadow:5px 5px 5px ;
            font-size: 23px;
        }
    </style>
</head>
<body>
    <div class="box">
        hey this is box
    </div>
    <p>this is para Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam laudantium illo mollitia.</p>
</body>
</html>
