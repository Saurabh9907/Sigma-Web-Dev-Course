<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shedo</title>
    <style>
        .box{border: 2px solid green;
            width:90vw;
            padding: 23px;
            box-shadow: 5px 15px 5px green;
            border-radius: 5px;
            margin: auto;
        }
        .text_shadow{
            outline: 2px solid blue;
            outline-offset: 10px;
            text-shadow: 9px 4px 4px #e00303;
            border: 2px solid black;
            border-radius: 5px;
            width: 90vw;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="box">
        i am shadow
    </div><br><br><br>
    <div class="text_shadow">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Provident reiciendis, a dolorum unde aliquam magni adipisci voluptatibus, inventore ipsum perferendis aperiam, doloremque facere?
    </div>
</body>
</html>
