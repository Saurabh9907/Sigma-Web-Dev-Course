<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid in CSS</title>
    <style>
        *{
            background-color: rgb(168, 153, 181);
        }
        .container{
            border: 2px solid black;
            display: grid;
            background-color: aquamarine;
            /* ye kuch nav bar and main or footer ko design karne ke kaam aata hai  */
            /* is me grid-template-area property ka use kiya jata hai  */
            grid-template-areas: "nav nav nav"
                                    "main side side "
                                    "footer footer footer";
        }
        .item{
            background-color: aqua;
            border: 2px solid black;
            height: 80px;

        }
        .item-1{
            grid-area: nav;
        }
        .item-2{
            grid-area: main;
        }
        .item-3{
            grid-area: side;
        }
        .item-4{
            grid-area: footer;
        }
        /* item-5 over lap hai item 1 par  */
        .item-5{
            grid-area: nav;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
    </div>
</body>
</html>
