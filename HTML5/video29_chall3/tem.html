<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card-design</title>
    
    <style>
      
        *{
            padding: 0;
            margin: 0;
        }
        .container{
            border: 2px solid black;
            margin: 20px;
            padding: 10px;
            border-radius: 15px;
            width: 320px;
            background-color: rgba(32, 6, 66, 0.841);
            border: none;
            
        }
        .pic{
            border: 2px solid black;
            border-radius: 10px;
            border: none;
            width: 310px;
            height: 250px;
            margin: 0px 0px 10px 0px;
        }
        .pic img{
            border: 2px solid black;
            border-radius: 10px;
            width: 310px;
            height: 250px;
            object-fit: cover;
            border: none;
        }
        .capsule{
            border: 2px solid black;
            border-radius: 13px;
            padding: 8px;
            font-size:16px ;
            margin: 30px 10px 30px 10px;
            background-color: rgb(94, 193, 193);
            border: none;
            color: white;
            width: 100px;
            height: 80px;
        }
        .capsule:hover{
            background-color: blue;
            color: black;

        }
        h2{
            margin: 25px 0px 10px 0px;
        }
        p{
            color: white;
            opacity:0.9;
            font-size: 18px;
            margin: auto 10px;
        }
        .read-more button{
            border: 2px solid black;
            border-radius:13px ;
            height: 45px;
            width: 100px;
            font-size: 15px;
            background-color: rgb(17, 91, 110);
            font-weight: bold;
            border: none;
            margin: 20px 50px 10px 110px;
            /* align-items: center; */
            /* display: flex; */
        }
        .read-more button:hover{
            background-color: blue;
            color: white;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="pic">
            <img src="https://img.freepik.com/premium-vector/lonely-man-sitting-jetty-sunset-scenery-lake_104785-1591.jpg" alt="lake">
        </div><br>
        <span class="capsule">Nature</span>
        <span class="capsule">Image</span>
        <h2>Sauriya Prajapati</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate veritatis labore, vero quos reiciendis tenetur!</p>
        <div class="read-more">
            <button>Read more</button>
        </div>
    </div>
</body>
</html>
