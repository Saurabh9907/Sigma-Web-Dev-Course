<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: aliceblue;
            border: 2px solid black;
            width: 60vw;
            height: 50vh;
            border-radius: 10px;
        }
        .box1{
            background-color: pink;
            border: 2px solid black;
            border-radius: 10px;
            width: 80px;
            height: 100px;
            border: none;
            margin: 5px;
            transition-property: all;
            transition-duration: 1s;
            transition-timing-function: ease;
            transition-delay: 0.5s;
            cursor: pointer;
        }
        .box:hover{
            transform: translateX(50px) translateY(50px) scale(2,2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1 box">One</div>
    </div>
</body>
</html>
