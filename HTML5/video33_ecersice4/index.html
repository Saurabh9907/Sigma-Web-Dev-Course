<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --firstcolor: red;
        --secondcolor: blue;
        --thirdcolor: yellow;
        --fourthcolor: pink;
        --fifthcolor: gray;
      }
      *{background-color:azure;}
      nav a {
        text-decoration: none;
        color: black;
        border: px solid black;
        margin: 89px;
        padding: 15px;
        cursor: pointer;
        border-radius: 7px;
        text-align: center;
        justify-content: center;
      }
      nav {
        border: 4px solid black;
        pad: 5px;
        height: 50px;
        margin: auto;
        width: 98vw;
        background-color: aqua;
        text-align: justify;
        display: flow-root;
      }
      h1 {
        margin-left: 10px;
        text-decoration: underline;
        text-shadow:10px 10px 10px black ;
      }
      nav a:nth-child(1) {
        background-color: var(--firstcolor);
      }
      nav a:nth-child(2) {
        background-color: var(--secondcolor);
      }
      nav a:nth-child(3) {
        background-color: var(--thirdcolor);
      }
      nav a:nth-child(4) {
        background-color: var(--fourthcolor);
      }
      nav a:nth-child(5) {
        background-color: var(--fifthcolor);
      }

    </style>
  </head>
  <body>
    <header>
      <h1>MR. SAURABH KUMAR PRAJAPATI...</h1>
    </header>
    <nav>
      <a href="#">Home</a>
      <a href="#">College Review</a>
      <a href="#">Course</a>
      <a href="#">Study Matiral</a>
      <a href="#">Sign up/Log in</a>
    </nav>
  </body>
</html>
