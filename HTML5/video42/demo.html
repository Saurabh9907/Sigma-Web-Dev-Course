<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Text in Box...</title>
    <style>
        .box {
            width: 300px; /* Box ki width */
            height: 150px; /* Box ki height */
            border: 1px solid #000; /* Border */
            display: flex; /* Flexbox ka istemal */
            justify-content: center; /* Horizontal center */
            align-items: center; /* Vertical center */
            text-align: center; /* Text ko center align kare */
        }
        .box{
            /* transform: scaleX(); */
            transition: transform 0.5s ease;
        }
        .box:hover{
            transform: scaleX(2);
            
        }
    </style>
</head>
<body>

<div class="box">
    Yeh text box ke center me hai.
</div>

</body>
</html>
