<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table styling</title>
    <style>
      nav > ul > li {
        background-color: yellow;
        border: 2px solid black;
        list-style-position: inside;/*this property use for manages position of list bulets*/
        list-style-type: "🥰";/*this property use for change the bulets type and remoeve the bulets*/
        list-style-image: url;/*for fixed img at the place bulets */
        padding: 5px;
        /* list-style:devanagari; */
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Content</li>
      </ul>
    </nav>
  </body>
</html>
