<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow property in css!</title>
    <style>
        .box{border: 3px solid black;
            height: 100px;
            width: 200px;
            overflow: auto;
            overflow:scroll;
            overflow-y:auto;
            overflow-x:scroll;
            text-overflow: ellipsis;
            white-space:wrap;
            /* overflow: hidden; */
        }
        body{background-color: bisque;}
    </style>
</head>
<body>
   <h1>Overflow property in css..</h1> 
   <div class="box">

   </div>

</html>
