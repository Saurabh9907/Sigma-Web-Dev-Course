<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display properties</title>
    <style>
      .container {
        color: red;
        border: 2px black solid;
        padding: 5px;
        display: flex;
        /* display: grid; */
        justify-content:center;
        border-radius:5px;
        background-color:yellow;
        flex-direction: row;
        flex-wrap:wrap;
        min-height: 90vh;
        justify-content: space-evenly;
        margin:auto;
      }
      .box {
        border: 2px solid blue;
        border-radius: 4px;
        background-color: navajowhite;
        width: 190px;
        height: 70vh;
        margin:40px;
        font-size: 20px;
        box-sizing: border-box;
        
      }
      *{
        padding: 10px;
        margin: 5px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box1 box">home</div>
      <div class="box2 box">about</div>
      <div class="box3 box">contact</div>
      <div class="box4 box">login/sign up</div>
    </div>
  </body>
</html>
