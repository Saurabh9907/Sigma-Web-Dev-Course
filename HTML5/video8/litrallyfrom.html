<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form action="post">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" placeholder="Enter your username">
        <br>
        <input type="checkbox" value="yes" id="yes">
        <label for="yes">Are you Adult.</label><br>
        
        <textarea name="comment" id="comment" cols="34" rows="10" placeholder="Enter your suggestion"></textarea>
        <br>
        <p>Select your favorite furits:</p>
        <select name="select" id="select">
            <option value="mango">mango</option>
            <option value="banana">banana</option>
            <option value="ornage">orange</option>
        </select>
        <p>Select Gender:</p>
        <input type="radio" name="gender" id="man" value="man">
        <label for="man">Man</label><br>
        <input type="radio" name="gender" value="femal" id="femal">
        <label for="femal">Femal</label><br>
        <input type="radio" name="gender" value="other" id="other">
        <label for="other">Other</label>
    </form>
</body>
</html>
