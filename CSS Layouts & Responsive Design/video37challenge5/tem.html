<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exersice-5</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            /* position: relative; */
        }
        nav{
            position: relative;
            height: 50px;
            /* width: 100vw; */
            background-color: antiquewhite;
            position: sticky;
            top: 0px;
        }
        .container{
            height: 80vh;
            display: flex;
            flex-direction: row;
            background-color: rgb(137, 201, 19);
            /* gap:23px; */
            padding: 40px;
            justify-content: space-around;
            align-items: center;
        }
        .box{
            background-color:aqua;
            height: 500px;
            width: 40vw;
        }
        .msg{
            width: 80vw;
            height: 200px;
            background-color: rgb(135, 116, 92);
            margin: 50px auto;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            /* padding: 80px; */
        }
        .msg p{
            margin: auto auto;
            color: rgb(60, 60, 209);
            margin-top: 0px;
        }
        .circle{
            border-radius: 30px;
            height: 50px;
            width: 50px;
            background-color: red;
            position: fixed;
            bottom: 60px;
            right: 20px;
        }
        footer{
            height: 50px;
            /* width: ; */
            background-color: brown;
        }
    </style>
</head>
<body>
    <nav></nav>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="msg"><p>Welcome to visit our page.</p></div>
    <div class="circle"></div>
    <footer></footer>
</body>
</html>
