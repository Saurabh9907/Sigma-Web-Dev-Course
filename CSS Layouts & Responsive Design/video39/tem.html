<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            border: 3px solid red;
            grid-template-columns: [first] 100px [second] 200px;
            grid-template-rows: 100px 100px;
        }
        .box{
            border: 2px solid black;
            height: 50px;
            width: 50px;
            background-color: aqua;
            margin: 5px;
        }
        .item-1{
            grid-row: 1/2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box item-1">6</div>
    </div>
</body>
</html>
