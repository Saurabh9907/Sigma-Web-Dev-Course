<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color:azure;
        }
        .container{
            border: 2px solid black;
            position: relative;
            width: 90vw;
            height: 90vmin;
            margin: 23px;
            padding: 10px;
        }
        .box{
            height: 250px;
            width: 80vw;
            border: 3px solid black;
            margin: 10px;
            padding: 5px;
        }
        .box1{
            background-color: red;
            position: sticky;
            
            /* position: absolute; */
            z-index: 9;
            top: 0px;
            left: 23px;
            margin: 0px;
        }
        .box2{
            background-color: green;
            z-index: 3;
            position: relative;
            top: 0px;
            left: 20px;
        }
        .box3{
            background-color: navajowhite;
            position: relative;
            z-index: 1;
        }
        .box4{
            background-color: blueviolet;
            /* position: fixed;
            bottom: 0px;
            left: 89px; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
    </div>
</body>
</html>
